<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        label, input, button { display: block; margin-bottom: 10px; }
        input[type="number"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Calculator</h1>
        <form id="productForm">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" name="num1" step="any" required>

            <label for="num2">Second Number:</label>
            <input type="number" id="num2" name="num2" step="any" required>

            <button type="submit">Calculate Product</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const num1Input = document.getElementById('num1');
            const num2Input = document.getElementById('num2');
            const resultDiv = document.getElementById('result');

            // Clear previous results/errors
            resultDiv.innerHTML = '';
            resultDiv.classList.remove('error');

            const num1 = parseFloat(num1Input.value);
            const num2 = parseFloat(num2Input.value);

            // Basic validation
            if (isNaN(num1) || isNaN(num2)) {
                resultDiv.innerHTML = 'Please enter valid numbers in both fields.';
                resultDiv.classList.add('error');
                return;
            }

            // Simulate calling the backend function (doing it client-side for this example)
            const product = num1 * num2;

            resultDiv.innerHTML = `The product is: ${product}`;
        });
    </script>
</body>
</html>
